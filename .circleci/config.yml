          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tiderun -j2
      - run:
          name: Simulate tiderun
          command: LIONSS_LP=1 ./build/tiderun --config tide.cfg --hours 24

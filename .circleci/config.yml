          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target I2cRecover -j2
      - run:
          name: Recover stuck bus
          command: LIONSS_LP=1 ./build/I2cRecover --conf i2c.cfg --clocks 9


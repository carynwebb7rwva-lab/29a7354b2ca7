version: 2.1

jobs:
  hollowpine:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load trunk
          command: |
            printf 'hollow 0.4\n' > pine.cfg
      - run:
          name: Build acoustic model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hollowpine -j2
      - run:
          name: Resonate hollow pine
          command: LIONSS_LP=1 ./build/hollowpine --config pine.cfg --modes 8
  windowFrame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write window
          command: |
            printf 'OVER (ORDER BY x)\n' > win.sql
      - run:
          name: Build window operator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windowFrame -j2
      - run:
          name: Evaluate window frame
          command: LIONSS_LP=1 ./build/windowFrame --sql win.sql --frame rows
  smartctl_long:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name device
          command: |
            printf 'dev /dev/sda\n' > smart.cfg
      - run:
          name: Build health monitor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target smartctl_long -j2
      - run:
          name: Run long self-test
          command: LIONSS_LP=1 ./build/smartctl_long --conf smart.cfg --captive
  Vp9Svc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make yuv
          command: |
            : > src.y4m
      - run:
          name: Build VP9 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Vp9Svc -j2
      - run:
          name: Encode VP9 SVC layers
          command: LIONSS_LP=1 ./build/Vp9Svc --in src.y4m --layers 3
  GiProbeBake:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place probes
          command: |
            printf 'probes 64\n' > probes.txt
      - run:
          name: Build light baker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GiProbeBake -j2
      - run:
          name: Bake GI probes
          command: LIONSS_LP=1 ./build/GiProbeBake --probes probes.txt --bounces 3
  anf-lower:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit core IR
          command: |
            printf 'let x = 1 in x\n' > core.anf
      - run:
          name: Build normalizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anf-lower -j2
      - run:
          name: Lower to A-normal form
          command: LIONSS_LP=1 ./build/anf-lower --in core.anf
  sift-match:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load images
          command: |
            : > a.jpg && : > b.jpg
      - run:
          name: Build feature matcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sift-match -j2
      - run:
          name: Match SIFT keypoints
          command: LIONSS_LP=1 ./build/sift-match --a a.jpg --b b.jpg --ratio 0.75
  tiderun:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
